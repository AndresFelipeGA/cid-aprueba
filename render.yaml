services:
  - type: web
    name: cid-aprueba
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: ./data/database.sqlite
      - key: UPLOAD_DIR
        value: ./uploads

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CID Aprueba</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ========== Login View ========== -->
  <div id="login-view" class="login hidden">
    <div class="login__card">
      <div class="login__brand">
        <img src="assets/logo-LA-CID.svg" alt="CID - Corporación Infancia y Desarrollo" class="login__logo-img">
      </div>
      <div id="login-error" class="login__error hidden"></div>
      <form id="login-form" autocomplete="off">
        <div class="form__group">
          <label class="form__label" for="login-username">Usuario</label>
          <input class="form__input" type="text" id="login-username" name="username" required autocomplete="username" placeholder="Ingrese su usuario">
        </div>
        <div class="form__group">
          <label class="form__label" for="login-password">Contrasena</label>
          <input class="form__input" type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="Ingrese su contrasena">
        </div>
        <button class="btn btn--primary btn--block" type="submit" id="login-btn">Ingresar</button>
      </form>
    </div>
  </div>

  <!-- ========== App View ========== -->
  <div id="app-view" class="app hidden">

    <!-- Overlay for mobile sidebar -->
    <div class="overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" role="navigation" aria-label="Menu principal">
      <div class="sidebar__brand">
        <img src="assets/logo-LA-CID.svg" alt="CID - Corporación Infancia y Desarrollo" class="sidebar__logo-img">
      </div>
      <nav class="sidebar__nav">
        <a href="#" class="sidebar__link sidebar__link--active" data-action="navigate" data-view="dashboard">
          Panel de Control
        </a>
        <a href="#" class="sidebar__link" data-action="navigate" data-view="documents">
          Documentos
        </a>
        <a href="#" class="sidebar__link" data-action="navigate" data-view="upload">
          Subir Documento
        </a>
        <a href="#" class="sidebar__link" data-action="navigate" data-view="profile">
          Perfil
        </a>
      </nav>
    </aside>

    <!-- Header -->
    <header class="header">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="mobile-toggle" id="mobile-toggle" aria-label="Abrir menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <h1 class="header__title" id="header-title">Panel de Control</h1>
      </div>
      <div class="header__user">
        <div class="header__user-info">
          <div class="header__user-name" id="user-name"></div>
          <div class="header__user-role" id="user-role"></div>
        </div>
        <button class="header__logout" id="btn-logout">Salir</button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main" id="main-content" role="main">
      <div class="loading">
        <div class="loading__spinner"></div>
        Cargando...
      </div>
    </main>

  </div>

  <!-- ========== Email Registration Modal ========== -->
  <div id="email-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="email-modal-title">
    <div class="modal__backdrop"></div>
    <div class="modal__content">
      <h2 class="modal__title" id="email-modal-title">Registra tu correo electronico</h2>
      <p class="modal__text">Para mejorar la comunicacion, por favor registra tu correo electronico.</p>
      <div id="email-modal-feedback"></div>
      <form id="email-modal-form">
        <div class="form__group">
          <label class="form__label" for="email-modal-input">Correo electronico</label>
          <input class="form__input" type="email" id="email-modal-input" required placeholder="ejemplo@correo.com">
        </div>
        <div class="modal__actions">
          <button class="btn btn--primary" type="submit" id="email-modal-save">Guardar</button>
          <button class="btn btn--outline" type="button" id="email-modal-skip">Omitir</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
